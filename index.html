<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI 聊天" />
  <meta name="application-name" content="AI 聊天" />
  <meta name="format-detection" content="telephone=no" />
  <title>AI 聊天</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button type="button" class="btn btn-primary btn-block" id="btnNewChat" title="新建对话">
          <span class="icon">＋</span> 新建对话
        </button>
      </div>
      <div class="sidebar-meta">
        <p class="sidebar-hint">对话历史保存在本机浏览器中</p>
      </div>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block" id="btnClearHistory" title="清空当前对话">
          清空当前对话
        </button>
        <button type="button" class="btn btn-ghost btn-block" id="btnOpenSettings" title="设置">
          ⚙ 设置
        </button>
      </div>
    </aside>

    <!-- Main chat -->
    <main class="main">
      <header class="topbar">
        <button type="button" class="btn btn-icon mobile-only" id="btnToggleSidebar" aria-label="菜单">☰</button>
        <div class="topbar-title">
          <h1>AI 聊天</h1>
          <span class="model-badge" id="modelBadge">gpt-4o-mini</span>
        </div>
        <button type="button" class="btn btn-icon" id="btnOpenSettingsTop" aria-label="设置" title="设置">⚙</button>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite">
        <!-- Welcome / messages injected by JS -->
      </div>

      <div class="composer-wrap">
        <div class="error-banner" id="errorBanner" hidden></div>
        <form class="composer" id="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="sentences"
            enterkeyhint="send"
          ></textarea>
          <button type="submit" class="btn btn-send" id="btnSend" title="发送" aria-label="发送">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <p class="composer-hint">消息经浏览器直连你配置的 API，密钥仅保存在本机 localStorage</p>
      </div>
    </main>
  </div>

  <!-- Settings modal -->
  <div class="modal-backdrop" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <h2 id="settingsTitle">设置</h2>
        <button type="button" class="btn btn-icon" id="btnCloseSettings" aria-label="关闭">✕</button>
      </div>
      <form class="modal-body" id="settingsForm">
        <label class="field">
          <span class="field-label">API Base URL</span>
          <input type="url" id="settingBaseUrl" placeholder="https://api.openai.com/v1" spellcheck="false" inputmode="url" />
          <span class="field-hint">兼容 OpenAI Chat Completions 的地址，末尾不要多余斜杠亦可</span>
        </label>
        <label class="field">
          <span class="field-label">API Key</span>
          <div class="input-with-toggle">
            <input type="password" id="settingApiKey" placeholder="sk-…" autocomplete="off" spellcheck="false" />
            <button type="button" class="btn btn-ghost btn-sm" id="btnToggleKey" title="显示/隐藏">显示</button>
          </div>
          <span class="field-hint">仅保存在本浏览器 localStorage，不会上传到其他服务器</span>
        </label>
        <label class="field">
          <span class="field-label">模型名称</span>
          <input type="text" id="settingModel" placeholder="gpt-4o-mini" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field-label">系统提示词（可选）</span>
          <textarea id="settingSystemPrompt" rows="4" placeholder="例如：你是一个有帮助的助手，请用简洁中文回答。"></textarea>
        </label>
        <label class="field field-inline">
          <input type="checkbox" id="settingStream" checked />
          <span>启用流式输出（stream）</span>
        </label>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btnCancelSettings">取消</button>
        <button type="button" class="btn btn-primary" id="btnSaveSettings">保存</button>
      </div>
    </div>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <script src="app.js"></script>
</body>
</html>
